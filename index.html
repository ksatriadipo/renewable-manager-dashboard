<!doctype html>
<html lang="en">
<head>
<meta name="rmct-static" content="1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>RM Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">RM Control Tower</div>
        <div class="brand-sub">Renewable Manager · menara kendali proyek</div>
      </div>
    </div>
    <div class="top-meta">
      <span id="health" class="pill" hidden></span>
      <span id="fresh" class="fresh"></span>
      <button id="reload" class="ghost" type="button" hidden>Refresh</button>
      <button id="theme" class="ghost" type="button" aria-label="Switch theme">Theme</button>
      <button id="logout" class="ghost" type="button" hidden>Sign out</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <a href="#overview">Overview</a><a href="#register">Tasks</a><a href="#timeline">Timeline</a><a href="#milestones">Milestones</a>
    <a href="#tokens">Tokens</a><a href="#productivity">Productivity</a><a href="#capacity">Capacity</a><a href="#risks">Blockers</a><a href="#forecast">Forecast</a><a href="#sources">Sources</a>
  </nav>
</header>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<main id="main" class="wrap">
  <section id="v-auth" class="view" hidden></section>
  <section id="v-overview" class="view" hidden></section>
  <section id="v-register" class="view" hidden></section>
  <section id="v-timeline" class="view" hidden></section>
  <section id="v-milestones" class="view" hidden></section>
  <section id="v-tokens" class="view" hidden></section>
  <section id="v-productivity" class="view" hidden></section>
  <section id="v-capacity" class="view" hidden></section>
  <section id="v-risks" class="view" hidden></section>
  <section id="v-forecast" class="view" hidden></section>
  <section id="v-sources" class="view" hidden></section>
</main>
<div id="drawer" class="drawer" hidden>
  <div class="drawer-in" role="dialog" aria-modal="true" aria-labelledby="dr-title">
    <button id="dr-close" class="ghost close" type="button">Close</button>
    <div id="dr-body"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
